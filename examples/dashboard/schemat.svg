<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="tank" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5b3a"/>
      <stop offset="0.45" stop-color="#ff9f43"/>
      <stop offset="0.75" stop-color="#5f8dff"/>
      <stop offset="1" stop-color="#2f6bff"/>
    </linearGradient>
    <linearGradient id="tankShine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="unit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4150"/>
      <stop offset="1" stop-color="#262b35"/>
    </linearGradient>
    <linearGradient id="mats" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff9f43" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff9f43" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1000" height="560" rx="22" fill="#171a21"/>
  <path d="M0 470 H1000" stroke="#ffffff" stroke-opacity="0.04"/>

  <!-- pipes heat pump <-> tank -->
  <path d="M262 205 H400 Q420 205 420 185 V165 Q420 145 440 145 H522" fill="none" stroke="#ff6b4a" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M262 330 H400 Q420 330 420 350 V420 Q420 440 440 440 H522" fill="none" stroke="#4aa8ff" stroke-width="10" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M314 205 l-14 -7 v14 z M494 145 l-14 -7 v14 z" fill="#ffd2c7"/>
  <path d="M480 440 l14 -7 v14 z M300 330 l14 -7 v14 z" fill="#cfe7ff"/>

  <!-- outdoor unit -->
  <rect x="40" y="135" width="222" height="270" rx="18" fill="url(#unit)" stroke="#4b5363" stroke-width="2"/>
  <circle cx="151" cy="250" r="72" fill="#1d2129" stroke="#4b5363" stroke-width="2"/>
  <g stroke="#59627a" stroke-width="2" fill="none">
    <circle cx="151" cy="250" r="60"/><circle cx="151" cy="250" r="44"/>
    <path d="M91 250 H211 M151 190 V310 M108.6 207.6 L193.4 292.4 M193.4 207.6 L108.6 292.4"/>
  </g>
  <g fill="#8a94ad" opacity="0.9">
    <path d="M151 250 C141 220 150 200 166 198 C170 220 162 238 151 250 Z"/>
    <path d="M151 250 C181 240 201 249 203 265 C181 269 163 261 151 250 Z"/>
    <path d="M151 250 C161 280 152 300 136 302 C132 280 140 262 151 250 Z"/>
    <path d="M151 250 C121 260 101 251 99 235 C121 231 139 239 151 250 Z"/>
  </g>
  <circle cx="151" cy="250" r="9" fill="#c9d1e3"/>
  <rect x="58" y="340" width="186" height="50" rx="10" fill="#14171d" opacity="0.6"/>
  <text x="151" y="118" text-anchor="middle" fill="#aab3c5" font-size="17" font-weight="600" letter-spacing="1">POMPA CIEPŁA</text>

  <!-- tank -->
  <rect x="522" y="62" width="160" height="440" rx="72" fill="url(#tank)" opacity="0.92"/>
  <rect x="522" y="62" width="160" height="440" rx="72" fill="url(#tankShine)"/>
  <rect x="522" y="62" width="160" height="440" rx="72" fill="none" stroke="#e8ecf5" stroke-opacity="0.35" stroke-width="2"/>
  <text x="602" y="42" text-anchor="middle" fill="#aab3c5" font-size="17" font-weight="600" letter-spacing="1">NOEL 700 l</text>
  <!-- probe marks -->
  <g fill="#ffffff"><circle cx="522" cy="140" r="5"/><circle cx="522" cy="285" r="5"/><circle cx="522" cy="430" r="5"/></g>
  <!-- DHW coil (upper) -->
  <path d="M682 108 H650 Q560 118 650 132 Q560 146 650 160 Q560 174 650 188 Q560 202 650 216 Q560 230 650 244 H682" fill="none" stroke="#ffffff" stroke-opacity="0.75" stroke-width="4" stroke-linejoin="round"/>
  <!-- mats coil (lower, copper) -->
  <path d="M682 330 H650 Q560 340 650 354 Q560 368 650 382 Q560 396 650 410 Q560 424 650 438 Q560 452 650 466 H682" fill="none" stroke="#e6a15c" stroke-width="4" stroke-linejoin="round"/>

  <!-- DHW out / cold in -->
  <path d="M682 108 H840" stroke="#ff6b4a" stroke-width="7" stroke-linecap="round"/>
  <path d="M682 244 H840" stroke="#4aa8ff" stroke-width="7" stroke-linecap="round"/>
  <g transform="translate(860 86)" fill="none" stroke="#e8ecf5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 22 H22 V10 H46 V22"/><path d="M34 10 V2 M26 2 H42"/><path d="M46 22 V34"/>
    <path d="M42 44 q4 6 0 10 M50 44 q4 6 0 10" stroke="#4aa8ff"/>
  </g>
  <text x="940" y="114" fill="#e8ecf5" font-size="17" font-weight="600">CWU</text>
  <text x="852" y="270" fill="#8a94ad" font-size="13">zimna woda</text>

  <!-- capillary mats -->
  <path d="M682 330 H790" stroke="#ff9f43" stroke-width="7" stroke-linecap="round"/>
  <path d="M682 466 H790" stroke="#4aa8ff" stroke-width="7" stroke-linecap="round"/>
  <rect x="790" y="318" width="180" height="160" rx="14" fill="url(#mats)" stroke="#ff9f43" stroke-opacity="0.45" stroke-width="2"/>
  <g fill="none" stroke="#ff9f43" stroke-opacity="0.75" stroke-width="2">
    <path d="M808 344 C828 334 848 354 868 344 S908 334 928 344 S948 354 952 350"/>
    <path d="M808 370 C828 360 848 380 868 370 S908 360 928 370 S948 380 952 376"/>
    <path d="M808 396 C828 386 848 406 868 396 S908 386 928 396 S948 406 952 402"/>
    <path d="M808 422 C828 412 848 432 868 422 S908 412 928 422 S948 432 952 428"/>
  </g>
  <text x="880" y="460" text-anchor="middle" fill="#e8ecf5" font-size="15" font-weight="600">Maty kapilarne</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
